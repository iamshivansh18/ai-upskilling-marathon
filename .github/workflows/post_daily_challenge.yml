name: Post Daily Challenge

on:
  schedule:
    # 20:55 UTC (Sunday-Thursday) = 02:25 AM IST (Monday-Friday)
    - cron: '55 20 * * 0-4'
  workflow_dispatch: # Allows manual testing from the Actions tab

jobs:
  post-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      # Upgraded to v5 to clear the Node.js 20 deprecation warning
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Calculate Day & Post Challenge Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking existing challenges..."
          
          # 1. Automatically create the label if it doesn't exist so the script never crashes
          gh label create "daily-challenge" --color "0e8a16" --description "AI Marathon Tasks" --force 2>/dev/null || true
          
          # 2. Count how many issues already have the 'daily-challenge' label
          EXISTING_COUNT=$(gh issue list --label "daily-challenge" --state all --json number -q 'length' 2>/dev/null || echo "0")
          if [ -z "$EXISTING_COUNT" ]; then EXISTING_COUNT=0; fi
          
          DAY_NUM=$((EXISTING_COUNT + 1))
          echo "Targeting deployment for Day $DAY_NUM..."
          
          # 3. Verify data/challenges.json actually exists before parsing
          if [ ! -f "data/challenges.json" ]; then
            echo "❌ ERROR: data/challenges.json file not found in this repository! Make sure you committed and pushed it."
            exit 1
          fi
          
          # 4. Extract title and body from JSON
          TITLE=$(jq -r ".[] | select(.day == $DAY_NUM) | .title" data/challenges.json)
          BODY=$(jq -r ".[] | select(.day == $DAY_NUM) | .body" data/challenges.json)
          
          # 5. Post the issue (Removed --assignee "@me" to prevent bot permission crashes)
          if [ -n "$TITLE" ] && [ "$TITLE" != "null" ]; then
            gh issue create \
              --title "🚀 Day $DAY_NUM: $TITLE" \
              --body "$BODY" \
              --label "daily-challenge"
            
            echo "✅ Successfully posted Day $DAY_NUM: $TITLE"
          else
            echo "⚠️ No challenge found for Day $DAY_NUM in data/challenges.json. Marathon completed!"
            exit 0
          fi
